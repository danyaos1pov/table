<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================ ТОКЕНЫ ============================ */
:root{
  --f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --e:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
  --bg:#08090c;
  --card:rgba(255,255,255,.034);
  --card-h:rgba(255,255,255,.066);
  --sheet:#111318;
  --bd:rgba(255,255,255,.08);
  --bd-h:rgba(255,255,255,.17);
  --tx:#eceef3;
  --tx-2:#9aa1af;
  --tx-3:#5e6473;
  --ac:#6b8cff;
  --ac-s:rgba(107,140,255,.16);
  --chip:#f7f8fa;
  --sh:0 26px 60px -24px rgba(0,0,0,.85);
  --grid:rgba(255,255,255,.03);
  --inset:inset 0 1px 0 rgba(255,255,255,.045);
}
html[data-theme="light"]{
  --bg:#f2f3f7;
  --card:#ffffff;
  --card-h:#ffffff;
  --sheet:#ffffff;
  --bd:rgba(16,22,40,.085);
  --bd-h:rgba(16,22,40,.2);
  --tx:#0d1117;
  --tx-2:#59616f;
  --tx-3:#98a0ae;
  --ac:#3459e6;
  --ac-s:rgba(52,89,230,.11);
  --chip:#ffffff;
  --sh:0 22px 50px -26px rgba(16,24,48,.3);
  --grid:rgba(16,22,40,.035);
  --inset:0 1px 2px rgba(16,24,48,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--f);background:var(--bg);color:var(--tx);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;transition:background .4s var(--e),color .4s var(--e);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,
             linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px;
  -webkit-mask-image:radial-gradient(85% 65% at 50% 0%,#000,transparent 78%);
          mask-image:radial-gradient(85% 65% at 50% 0%,#000,transparent 78%);
}
.wrap{position:relative;z-index:1;width:100%;max-width:1020px;padding:46px 26px 46px}

/* ============================ ШАПКА ============================ */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.time{font:600 42px/1 var(--f);letter-spacing:-2.4px;font-variant-numeric:tabular-nums}
.time i{font-style:normal;color:var(--tx-3);font-weight:400}
.hello{margin-top:8px;font:400 13px var(--f);color:var(--tx-2)}
.tgl{width:36px;height:36px;flex:none;border:1px solid var(--bd);border-radius:11px;background:var(--card);
  color:var(--tx-2);cursor:pointer;display:grid;place-items:center;transition:.22s var(--e);box-shadow:var(--inset)}
.tgl:hover{color:var(--tx);border-color:var(--bd-h)}
.tgl svg{width:16px;height:16px}

/* ============================ ПОИСК ============================ */
form.s{display:flex;align-items:center;gap:3px;height:54px;padding:5px;margin-bottom:34px;position:relative;z-index:20;
  background:var(--card);border:1px solid var(--bd);border-radius:15px;box-shadow:var(--inset);
  transition:border-color .22s var(--e),box-shadow .22s var(--e)}
form.s:focus-within{border-color:var(--bd-h);box-shadow:0 0 0 4px var(--ac-s)}
.eng{position:relative;flex:none}
.eng>button{display:flex;align-items:center;gap:8px;height:44px;padding:0 11px;border:0;border-radius:10px;
  background:transparent;color:var(--tx);cursor:pointer;font:500 13px var(--f);transition:background .16s}
.eng>button:hover{background:var(--card-h)}
.bdg{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font:700 10.5px var(--f);color:#fff;flex:none}
.chev{width:10px;height:10px;opacity:.4;transition:transform .22s var(--e)}
.eng.op .chev{transform:rotate(180deg)}
.menu{position:absolute;top:calc(100% + 10px);left:0;min-width:190px;padding:5px;z-index:60;
  background:var(--sheet);border:1px solid var(--bd);border-radius:13px;box-shadow:var(--sh);
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s var(--e)}
.eng.op .menu{opacity:1;visibility:visible;transform:none}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:9px;
  background:transparent;color:var(--tx);font:400 13px var(--f);cursor:pointer;transition:.14s}
.menu button:hover{background:var(--card-h)}
.menu button.on{color:var(--ac);background:var(--ac-s)}
.vr{width:1px;height:20px;background:var(--bd);flex:none;margin:0 5px}
input.q{flex:1;min-width:0;height:44px;border:0;background:transparent;color:var(--tx);font:400 14.5px var(--f);outline:none;padding:0 4px}
input.q::placeholder{color:var(--tx-3)}
.sb{width:44px;height:44px;flex:none;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer;
  display:grid;place-items:center;transition:.18s var(--e)}
.sb:hover{filter:brightness(1.12)}
.sb svg{width:16px;height:16px}

/* ============================ СЕКЦИИ ============================ */
section{margin-bottom:24px}
.lbl{display:flex;align-items:center;gap:12px;margin:0 0 12px 2px}
.lbl span{font:600 10px/1 var(--f);letter-spacing:1.8px;text-transform:uppercase;color:var(--tx-3)}
.lbl i{flex:1;height:1px;background:var(--bd)}

/* иконка сайта: цветной монограмм → реальный фавикон */
.ic{border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none;overflow:hidden;
  transition:transform .25s var(--e),background .2s}
.ic b{font:700 14px var(--f);color:#fff;letter-spacing:-.3px}
.ic img{display:block}
.ic.has{background:var(--chip);box-shadow:0 1px 4px rgba(0,0,0,.25)}
html[data-theme="light"] .ic.has{box-shadow:inset 0 0 0 1px var(--bd)}

/* ---- избранное ---- */
.fav{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  padding:15px;min-height:104px;border:1px solid var(--bd);border-radius:17px;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 11%,transparent),transparent 62%),var(--card);
  box-shadow:var(--inset);text-decoration:none;color:var(--tx);cursor:pointer;font-family:var(--f);
  transition:transform .26s var(--e),border-color .26s var(--e),box-shadow .26s var(--e);
  animation:up .5s var(--e) backwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 42%,var(--bd));box-shadow:var(--sh)}
.card:hover .ic{transform:scale(1.07)}
.card .ic{width:40px;height:40px;border-radius:11px}
.card .ic img{width:25px;height:25px}
.card .nm{font:600 14.5px var(--f);letter-spacing:-.2px;text-align:left}
.card .dm{font:400 11.5px var(--f);color:var(--tx-3);margin-top:3px;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{position:absolute;top:15px;right:15px;color:var(--tx-3)}
.lk svg{width:14px;height:14px;display:block}

/* ---- ссылки и папки: одинаковая сетка ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.pill{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--bd);border-radius:14px;
  background:var(--card);box-shadow:var(--inset);text-decoration:none;color:var(--tx);cursor:pointer;
  font-family:var(--f);text-align:left;overflow:hidden;
  transition:transform .22s var(--e),border-color .22s var(--e),background .22s var(--e);
  animation:up .5s var(--e) backwards}
.pill:hover{transform:translateY(-2px);background:var(--card-h);border-color:color-mix(in srgb,var(--c) 42%,var(--bd))}
.pill:hover .ic{transform:scale(1.07)}
.pill .ic{width:32px;height:32px;border-radius:9px}
.pill .ic b{font-size:12.5px}
.pill .ic img{width:19px;height:19px}
.pill .t{min-width:0;flex:1}
.pill .t b{display:block;font:600 13.5px var(--f);letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .t small{font:400 11px var(--f);color:var(--tx-3)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.fic{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c)}
.fic svg{width:17px;height:17px}

/* ============================ ШТОРКА ============================ */
.ov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;
  background:rgba(4,5,8,.6);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  opacity:0;visibility:hidden;transition:.24s var(--e)}
html[data-theme="light"] .ov{background:rgba(118,128,152,.34)}
.ov.op{opacity:1;visibility:visible}
.sheet{width:min(460px,100%);max-height:78vh;overflow:auto;padding:18px;
  background:var(--sheet);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);
  transform:translateY(12px) scale(.97);transition:.3s var(--e)}
.ov.op .sheet{transform:none}
.sh-h{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.sh-h .fic{width:34px;height:34px;border-radius:10px;flex:none}
.sh-h h3{flex:1;font:600 15.5px var(--f);letter-spacing:-.3px}
.x{width:30px;height:30px;border:1px solid var(--bd);border-radius:9px;background:transparent;color:var(--tx-3);
  cursor:pointer;display:grid;place-items:center;transition:.2s;flex:none}
.x:hover{color:var(--tx);background:var(--card-h)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--tx);
  transition:.16s var(--e)}
.row:hover{background:var(--card-h);transform:translateX(3px)}
.row .ic{width:30px;height:30px;border-radius:9px}
.row .ic b{font-size:12px}
.row .ic img{width:18px;height:18px}
.row .n{flex:1;font:500 13.5px var(--f);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font:400 11px var(--f);color:var(--tx-3);flex:none}
.empty{padding:26px 8px;text-align:center;font:400 13px var(--f);color:var(--tx-3)}
.pw p{font:400 12.5px var(--f);color:var(--tx-2);margin:2px 2px 12px}
.pw-in{display:flex;gap:8px}
.pw input{flex:1;height:44px;padding:0 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);
  color:var(--tx);font:500 15px var(--f);letter-spacing:4px;outline:none;transition:.2s var(--e)}
.pw input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-s)}
.pw.bad input{border-color:#ff4d5e;box-shadow:0 0 0 4px rgba(255,77,94,.15)}
.pw.bad{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pw button{height:44px;padding:0 17px;border:0;border-radius:12px;background:var(--ac);color:#fff;
  font:600 13.5px var(--f);cursor:pointer;transition:.18s}
.pw button:hover{filter:brightness(1.12)}

.foot{margin-top:26px;text-align:center;font:400 11px var(--f);color:var(--tx-3)}
kbd{font:500 10px var(--f);padding:2px 5px;border-radius:5px;border:1px solid var(--bd);color:var(--tx-2)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--bd-h);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:780px){.fav{grid-template-columns:repeat(2,1fr)}}
@media(max-width:780px){.grid.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.wrap{padding:28px 16px}.time{font-size:34px}.grid,.grid.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <div class="time" id="time">--<i>:</i>--</div>
      <div class="hello" id="hello"></div>
    </div>
    <button class="tgl" id="tgl" title="Тема"></button>
  </div>

  <form class="s" id="form" autocomplete="off">
    <div class="eng" id="eng">
      <button type="button" id="engBtn">
        <span class="bdg" id="engBdg">G</span><span id="engNm">Google</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="menu" id="engMenu"></div>
    </div>
    <div class="vr"></div>
    <input class="q" id="q" placeholder="Поиск или адрес" spellcheck="false">
    <button class="sb" type="submit" title="Найти">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    </button>
  </form>

  <section><div class="lbl"><span>Избранное</span><i></i></div><div class="fav" id="fav"></div></section>
  <section><div class="lbl"><span>Ссылки</span><i></i></div><div class="grid" id="links"></div></section>
  <section><div class="lbl"><span>Папки</span><i></i></div><div class="grid g3" id="folders"></div></section>

  <div class="foot"><kbd>/</kbd> поиск · <kbd>Ctrl</kbd>+<kbd>K</kbd> поисковик · <kbd>Esc</kbd> закрыть</div>
</div>

<div class="ov" id="ov">
  <div class="sheet">
    <div class="sh-h">
      <div class="fic" id="shIc"></div>
      <h3 id="shTitle"></h3>
      <button class="x" id="shX"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="shBody"></div>
  </div>
</div>

<script>
/* =================================================================
   ССЫЛКИ — правь здесь.  c — цвет иконки, если фавикон не загрузится
   ================================================================= */
const FAV = [
  { nm:'ВКонтакте', url:'https://vk.com/feed',      c:'#0077FF' },
  { nm:'YouTube',   url:'https://www.youtube.com/',  c:'#FF0033' },

  { nm:'Личное',    lock:true,                       c:'#8b93a7', links:[
      /* пусто. добавляй так:  { nm:'Название', url:'https://...', c:'#888888' } */
  ]}
];

const LINKS = [
  { nm:'Google Таблицы', url:'https://docs.google.com/spreadsheets/',            c:'#0F9D58' },
  { nm:'Редактор HTML',  url:'https://htmleditor.gitlab.io/',                    c:'#E44D26' },
  { nm:'GitHub',         url:'https://github.com/danyaos1pov?tab=repositories',  c:'#6E7681' },
  { nm:'SoloBot',        url:'https://pocomacho.ru/solonetbot/',                 c:'#2AABEE' },
  { nm:'Detector 404',   url:'https://detector404.ru/',                          c:'#EF4444' }
];

const FOLDERS = [
  { nm:'ON1X VPN', c:'#14b8ff', links:[
    { nm:'Сайт',      url:'https://on1xvpn.com/',        c:'#14b8ff' },
    { nm:'ЛК',        url:'https://bot.on1xvpn.com/lk/', c:'#2AABEE' },
    { nm:'Remnawave', url:'https://admin.on1xvpn.com/',  c:'#6b8cff' }
  ]},
  { nm:'Домены', c:'#6b8cff', links:[
    { nm:'TimeWeb', url:'https://hosting.timeweb.ru/domains?page=1', c:'#3B7EF5' },

  ]},
  { nm:'ИИ', c:'#a86bff', links:[
    { nm:'ChatGPT',    url:'https://chatgpt.com/',            c:'#10A37F' },
    { nm:'Gemini',     url:'https://gemini.google.com/app',   c:'#4285F4' },
    { nm:'Grok',       url:'https://grok.com/',               c:'#222222' },
    { nm:'Perplexity', url:'https://www.perplexity.ai/',      c:'#20808D' },
    { nm:'Qwen',       url:'https://chat.qwen.ai/',           c:'#6E4AFF' }
  ]},
  { nm:'Сервера', c:'#00c2a3', links:[
    { nm:'Aeza',      url:'https://my.aeza.net/',                     c:'#7C5CFF' },
    { nm:'SpaceCore', url:'http://billing.spacecore.pro/',            c:'#3D5AFE' },
    { nm:'Play2Go',   url:'https://play2go.cloud/',                   c:'#FF6B35' },
    { nm:'ServHost',  url:'https://serv.host/',                       c:'#2E86DE' },
    { nm:'Vyrex',     url:'https://my.vyrex.co/billmgr?startform=vds',c:'#00B894' }
  ]},
  { nm:'Почта', c:'#ff7a45', links:[
    { nm:'Mail',   url:'https://e.mail.ru/inbox/',                 c:'#0F7BFF' },
    { nm:'Яндекс', url:'https://mail.yandex.ru/',                  c:'#FC3F1D' },
    { nm:'Google', url:'https://mail.google.com/mail/u/0/#inbox',  c:'#EA4335' }
  ]},
  { nm:'Остальное', c:'#8b95a8', links:[
    { nm:'Hostoff',   url:'https://panel.hostoff.net/services/virtual-servers', c:'#22C55E' },
    { nm:'TimeWeb',   url:'https://timeweb.cloud/my/servers/6595709',           c:'#3B7EF5' },
    { nm:'IT-Garage', url:'https://my.it-garage.pro/',                          c:'#F59E0B' }
  ]}
];

const ENGINES = [
  { id:'google', nm:'Google',     bd:'G', c:'#4285F4', u:'https://www.google.com/search?q=' },
  { id:'yandex', nm:'Яндекс',     bd:'Я', c:'#FC3F1D', u:'https://yandex.ru/search/?text=' },
  { id:'ddg',    nm:'DuckDuckGo', bd:'D', c:'#DE5833', u:'https://duckduckgo.com/?q=' }
];

/* Пароль папки «Личное» (сейчас 4815162342) хранится хешем.
   Сменить: открой консоль (F12) и выполни
   let h=2166136261;for(const c of 'НОВЫЙ'){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}console.log(h)
   полученное число вставь сюда: */
const PW_HASH = 3582514485;

/* =================================================================
   ЛОГИКА
   ================================================================= */
const S={g:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},
         s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h};
const el=(t,c)=>{const x=document.createElement(t);if(c)x.className=c;return x};

/* тема */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';
const tgl=document.getElementById('tgl');
const setTheme=t=>{document.documentElement.setAttribute('data-theme',t);tgl.innerHTML=t==='dark'?SUN:MOON;S.s('sp_theme',t)};
setTheme(S.g('sp_theme','dark'));
tgl.onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* часы */
const tick=()=>{
  const d=new Date();
  document.getElementById('time').innerHTML=String(d.getHours()).padStart(2,'0')+'<i>:</i>'+String(d.getMinutes()).padStart(2,'0');
  const h=d.getHours(),g=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  document.getElementById('hello').textContent=g+' · '+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
};
tick();setInterval(tick,10000);

/* иконка: цветной монограмм, поверх — настоящий фавикон, если загрузится */
function icon(it){
  const box=el('div','ic');
  box.style.setProperty('--c',it.c||'#7d8494');
  const b=el('b');b.textContent=(it.nm||'?').trim()[0].toUpperCase();box.appendChild(b);
  const h=host(it.url);if(!h)return box;
  const srcs=['https://icons.duckduckgo.com/ip3/'+h+'.ico',
              'https://www.google.com/s2/favicons?sz=128&domain='+h,
              'https://'+h+'/favicon.ico'];
  let i=0;const img=new Image();
  img.onerror=()=>{ if(++i<srcs.length) img.src=srcs[i] };
  img.onload=()=>{ if(img.naturalWidth>4){box.textContent='';box.classList.add('has');box.appendChild(img)} else img.onerror() };
  img.src=srcs[0];
  return box;
}
const FOLDER_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 015.5 5h3.2l2 2.2h7.8A2.5 2.5 0 0121 9.7v7.8a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 17.5v-10z"/></svg>';
const LOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.8a4 4 0 018 0v2.7"/></svg>';
const plural=n=>{const a=n%10,b=n%100;return a===1&&b!==11?'ссылка':a>=2&&a<=4&&(b<10||b>=20)?'ссылки':'ссылок'};
let d=0;

/* избранное */
const favEl=document.getElementById('fav');
FAV.forEach(it=>{
  const c=el(it.lock?'button':'a','card');
  c.style.setProperty('--c',it.c);c.style.animationDelay=(d+=45)+'ms';
  if(it.lock){c.type='button';c.onclick=()=>openLocked(it)}else{c.href=it.url;c.rel='noreferrer'}
  c.appendChild(icon(it));
  const t=el('div');
  const n=el('div','nm');n.textContent=it.nm;
  const s=el('div','dm');s.textContent=it.lock?'под паролем':host(it.url);
  t.append(n,s);c.appendChild(t);
  if(it.lock){const l=el('div','lk');l.innerHTML=LOCK_SVG;c.appendChild(l)}
  favEl.appendChild(c);
});

/* ссылки */
const linksEl=document.getElementById('links');
LINKS.forEach(it=>{
  const a=el('a','pill');a.href=it.url;a.rel='noreferrer';
  a.style.setProperty('--c',it.c);a.style.animationDelay=(d+=32)+'ms';
  a.appendChild(icon(it));
  const t=el('div','t');const b=el('b');b.textContent=it.nm;
  const s=el('small');s.textContent=host(it.url);t.append(b,s);
  a.appendChild(t);linksEl.appendChild(a);
});

/* папки */
const folEl=document.getElementById('folders');
FOLDERS.forEach(f=>{
  const b=el('button','pill');b.type='button';
  b.style.setProperty('--c',f.c);b.style.animationDelay=(d+=32)+'ms';
  const ic=el('div','ic fic');ic.style.setProperty('--c',f.c);ic.innerHTML=FOLDER_SVG;
  ic.style.background='color-mix(in srgb,'+f.c+' 17%,transparent)';ic.style.color=f.c;
  b.appendChild(ic);
  const t=el('div','t');const nm=el('b');nm.textContent=f.nm;
  const s=el('small');s.textContent=f.links.length+' '+plural(f.links.length);
  t.append(nm,s);b.appendChild(t);
  b.onclick=()=>openFolder(f);
  folEl.appendChild(b);
});

/* шторка */
const ov=document.getElementById('ov'),shBody=document.getElementById('shBody'),
      shTitle=document.getElementById('shTitle'),shIc=document.getElementById('shIc');
document.getElementById('shX').onclick=closeSheet;
ov.onclick=e=>{if(e.target===ov)closeSheet()};
function closeSheet(){ov.classList.remove('op')}
function listOf(links){
  if(!links.length){const e=el('div','empty');e.textContent='Пока пусто';return e}
  const w=el('div','rows');
  links.forEach(l=>{
    const a=el('a','row');a.href=l.url;a.rel='noreferrer';
    a.appendChild(icon(l));
    const n=el('div','n');n.textContent=l.nm;
    const s=el('div','d');s.textContent=host(l.url);
    a.append(n,s);w.appendChild(a);
  });
  return w;
}
function head(f,svg){
  shIc.style.background='color-mix(in srgb,'+f.c+' 17%,transparent)';
  shIc.style.color=f.c;shIc.innerHTML=svg;shTitle.textContent=f.nm;shBody.innerHTML='';
}
function openFolder(f){head(f,FOLDER_SVG);shBody.appendChild(listOf(f.links));ov.classList.add('op')}
function openLocked(f){
  head(f,LOCK_SVG);
  if(sessionStorage.getItem('sp_unlocked')==='1'){shBody.appendChild(listOf(f.links));ov.classList.add('op');return}
  const box=el('div','pw');
  box.innerHTML='<p>Папка защищена паролем</p><div class="pw-in">'+
    '<input type="password" inputmode="numeric" placeholder="••••••••••"><button type="button">Открыть</button></div>';
  const inp=box.querySelector('input');
  const go=()=>{
    if(hash(inp.value)===PW_HASH){try{sessionStorage.setItem('sp_unlocked','1')}catch(e){}
      shBody.innerHTML='';shBody.appendChild(listOf(f.links));}
    else{box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');inp.select()}
  };
  box.querySelector('button').onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
  shBody.appendChild(box);ov.classList.add('op');
  setTimeout(()=>inp.focus(),250);
}

/* поиск */
const eng=document.getElementById('eng'),menu=document.getElementById('engMenu'),q=document.getElementById('q');
let cur=ENGINES.find(e=>e.id===S.g('sp_engine','google'))||ENGINES[0];
const paint=()=>{
  const b=document.getElementById('engBdg');b.textContent=cur.bd;b.style.background=cur.c;
  document.getElementById('engNm').textContent=cur.nm;
  q.placeholder='Поиск в '+cur.nm+' или адрес';
  [...menu.children].forEach(x=>x.classList.toggle('on',x.dataset.id===cur.id));
};
ENGINES.forEach(e=>{
  const b=el('button');b.type='button';b.dataset.id=e.id;
  b.innerHTML='<span class="bdg" style="background:'+e.c+'">'+e.bd+'</span><span>'+e.nm+'</span>';
  b.onclick=ev=>{ev.stopPropagation();cur=e;S.s('sp_engine',e.id);paint();eng.classList.remove('op');q.focus()};
  menu.appendChild(b);
});
paint();
document.getElementById('engBtn').onclick=ev=>{ev.stopPropagation();eng.classList.toggle('op')};
document.addEventListener('click',()=>eng.classList.remove('op'));
document.getElementById('form').onsubmit=ev=>{
  ev.preventDefault();const v=q.value.trim();if(!v)return;
  const isUrl=/^https?:\/\//i.test(v)||/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v);
  location.href=isUrl?(/^https?:\/\//i.test(v)?v:'https://'+v):cur.u+encodeURIComponent(v);
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();eng.classList.remove('op');q.blur()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();
    cur=ENGINES[(ENGINES.indexOf(cur)+1)%ENGINES.length];S.s('sp_engine',cur.id);paint();q.focus()}
  if(e.key==='/'&&document.activeElement!==q&&!ov.classList.contains('op')){e.preventDefault();q.focus()}
});
</script>
</body>

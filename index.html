<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовая страница</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #14151f 0%, #0a0b10 100%);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-glow: rgba(0, 242, 254, 0.08);
            --text-main: #f1f1f4;
            --text-muted: #62667a;
            --accent: #00f2fe;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.02) 0%, transparent 70%);
            top: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1250px;
            height: 85vh;
            display: flex;
            gap: 24px;
        }

        /* ЛЕВАЯ ПАНЕЛЬ */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .profile-zone {
            margin-bottom: 24px;
            padding-left: 8px;
        }

        .profile-zone h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .profile-zone p {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin: 12px 0 6px 8px;
            font-weight: 700;
        }

        /* Плитки ссылок */
        .link-tile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .link-tile:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 242, 254, 0.2);
            transform: translateX(4px);
        }

        .link-tile .title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 5px;
        }

        /* ПРАВАЯ ЧАСТЬ */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 8px;
        }

        .main-content::-webkit-scrollbar {
            width: 5px;
        }
        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .main-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ПОИСКОВАЯ СТРОКА */
        .search-container {
            margin-bottom: 24px;
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 6px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            z-index: 5;
        }

        .search-container:focus-within {
            border-color: rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.05);
            z-index: 50;
        }

        .search-form {
            display: flex;
            width: 100%;
            align-items: center;
        }

        /* Селектор поисковика */
        .search-engine-selector {
            position: relative;
            margin-right: 8px;
        }

        .current-engine {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            transition: all 0.2s ease;
        }

        .current-engine:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .current-engine svg {
            width: 10px;
            height: 10px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2.5;
            transition: transform 0.3s ease;
        }

        .search-engine-selector.is-active .current-engine svg {
            transform: rotate(180deg);
            stroke: var(--accent);
        }

        .engine-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: #0f1017;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 6px;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-engine-selector.is-active .engine-dropdown {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .engine-option {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .engine-option:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        .engine-option.is-selected {
            color: var(--accent);
            background: rgba(0, 242, 254, 0.03);
        }

        /* Поле ввода */
        .search-input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 10px 36px 10px 4px;
            font-size: 1rem;
            color: var(--text-main);
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Кнопка мгновенной очистки */
        .search-clear-btn {
            position: absolute;
            right: 8px;
            width: 24px;
            height: 24px;
            background: transparent;
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .search-clear-btn.is-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .search-clear-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .search-clear-btn svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        /* Кнопка отправки */
        .search-submit-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .search-submit-btn:hover {
            background: var(--accent);
            color: #0a0b10;
            box-shadow: 0 0 12px var(--accent);
        }

        .search-submit-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        /* Сетки контента */
        .top-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }

        .top-links-grid .link-tile:hover {
            transform: translateY(-2px);
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        /* Карточка папки */
        .folder-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            height: 135px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .folder-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .folder-card-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .folder-visual-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .folder-card:hover .folder-visual-icon {
            color: var(--accent);
            background: rgba(0, 242, 254, 0.05);
            border-color: rgba(0, 242, 254, 0.2);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }

        .folder-visual-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .folder-card-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .folder-card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ПОП-АП ОКНО */
        .folder-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 11, 16, 0.4);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .folder-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .folder-overlay.is-active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-right: 35px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-btn {
            position: absolute;
            top: 22px;
            right: 22px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            transform: rotate(90deg);
        }

        .close-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        .modal-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .modal-links::-webkit-scrollbar {
            width: 4px;
        }
        .modal-links::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .nested-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .folder-overlay.is-active .nested-link {
            opacity: 1;
            transform: translateY(0);
        }

        .folder-overlay.is-active .nested-link:nth-child(1) { transition-delay: 0.04s; }
        .folder-overlay.is-active .nested-link:nth-child(2) { transition-delay: 0.08s; }
        .folder-overlay.is-active .nested-link:nth-child(3) { transition-delay: 0.12s; }
        .folder-overlay.is-active .nested-link:nth-child(4) { transition-delay: 0.16s; }
        .folder-overlay.is-active .nested-link:nth-child(5) { transition-delay: 0.20s; }
        .folder-overlay.is-active .nested-link:nth-child(6) { transition-delay: 0.24s; }
        .folder-overlay.is-active .nested-link:nth-child(7) { transition-delay: 0.28s; }

        .nested-link:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(0, 242, 254, 0.3);
            transform: translateX(4px);
        }

        .arrow-icon {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .link-tile:hover .arrow-icon, .nested-link:hover .arrow-icon {
            background: var(--accent);
            color: #0a0b10;
            box-shadow: 0 0 10px var(--accent);
        }

        .arrow-icon svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        /* Стиль для кастомного окна ввода пароля */
        .password-prompt-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .password-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .password-input:focus {
            border-color: var(--accent);
        }

        .password-error-msg {
            color: #ff4a4a;
            font-size: 0.85rem;
            display: none;
        }

        .password-submit-btn {
            background: var(--accent);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #0a0b10;
            cursor: pointer;
            transition: all 0.2s;
        }

        .password-submit-btn:hover {
            box-shadow: 0 0 12px var(--accent);
            opacity: 0.9;
        }

        @media (max-height: 780px) {
            .container { height: 90vh; }
            .folder-card { height: 125px; padding: 16px; }
            .top-links-grid { margin-bottom: 20px; }
            .search-container { margin-bottom: 20px; }
        }

        /* МЕДИА-ЗАПРОСЫ ДЛЯ АДАПТАЦИИ ПОД ТЕЛЕФОНЫ */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                padding: 12px;
                align-items: flex-start;
            }

            .bg-glow {
                width: 300px;
                height: 300px;
            }

            .container {
                flex-direction: column;
                height: auto;
                gap: 16px;
            }

            /* Боковая панель сверху */
            .sidebar {
                width: 100%;
                padding: 16px;
                border-radius: 20px;
            }

            .profile-zone {
                margin-bottom: 16px;
            }

            .profile-zone h1 {
                font-size: 1.4rem;
            }

            .sidebar-links {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
            }

            /* Основной контент */
            .main-content {
                padding-right: 0;
                overflow-y: visible;
            }

            /* Поисковая строка */
            .search-container {
                padding: 4px;
                border-radius: 14px;
                margin-bottom: 16px;
            }

            .current-engine {
                padding: 8px 10px;
                font-size: 0.8rem;
                border-radius: 10px;
                gap: 4px;
            }

            .search-input {
                font-size: 0.9rem;
                padding: 8px 30px 8px 2px;
            }

            .search-submit-btn {
                width: 34px;
                height: 34px;
                border-radius: 10px;
            }

            .engine-dropdown {
                min-width: 120px;
                top: calc(100% + 6px);
            }

            .engine-option {
                padding: 8px 10px;
                font-size: 0.85rem;
            }

            /* Сетки ссылок */
            .top-links-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
                margin-bottom: 20px;
            }

            .link-tile {
                padding: 12px;
                border-radius: 12px;
            }

            .link-tile .title {
                font-size: 0.85rem;
            }

            .arrow-icon {
                width: 24px;
                height: 24px;
            }

            /* Папки */
            .folder-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }

            .folder-card {
                padding: 14px;
                height: 110px;
                border-radius: 16px;
            }

            .folder-visual-icon {
                width: 32px;
                height: 32px;
                border-radius: 10px;
            }

            .folder-visual-icon svg {
                width: 16px;
                height: 16px;
            }

            .folder-card-title {
                font-size: 0.9rem;
            }

            .folder-card-meta {
                font-size: 0.75rem;
            }

            /* Окна всплытия (Модалки) */
            .modal-content {
                max-width: calc(100% - 24px);
                padding: 20px;
                border-radius: 20px;
            }

            .modal-title {
                font-size: 1.1rem;
            }

            .close-btn {
                top: 18px;
                right: 18px;
                width: 28px;
                height: 28px;
            }

            .modal-links {
                max-height: 300px;
            }

            .nested-link {
                padding: 12px 14px;
                border-radius: 12px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .top-links-grid, .folder-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        
        <aside class="sidebar">
            <div class="profile-zone">
                <h1 id="greeting">Привет</h1>
                <p>Dashboard</p>
            </div>
            
            <span class="sidebar-label">Избранное</span>
            <div class="sidebar-links">
                <a href="https://vk.com/feed" class="link-tile">
                    <span class="title">ВКонтакте</span>
                    <div class="arrow-icon"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
                </a>
                <a href="https://www.youtube.com/" class="link-tile">
                    <span class="title">YouTube</span>
                    <div class="arrow-icon"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
                </a>
                <div class="link-tile" id="secret-tile" data-target="folder-secret" data-protected="true">
                    <span class="title">Секретное</span>
                    <div class="arrow-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            
            <div class="search-container">
                <form class="search-form" id="searchForm" target="_blank" action="https://yandex.ru/search/">
                    <div class="search-engine-selector" id="engineSelector">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Динамическое приветствие
            const greetingElement = document.getElementById('greeting');
            const hours = new Date().getHours();
            let greetingText = 'Привет';

            if (hours >= 5 && hours < 12) greetingText = 'Доброе утро';
            else if (hours >= 12 && hours < 18) greetingText = 'Добрый день';
            else if (hours >= 18 && hours < 23) greetingText = 'Добрый вечер';
            else greetingText = 'Доброй ночи';

            greetingElement.textContent = greetingText;

            // Контейнер поиска для динамического управления слоями
            const searchContainer = document.querySelector('.search-container');
            const engineSelector = document.getElementById('engineSelector');
            const currentEngine = document.getElementById('currentEngine');
            const engineLabel = document.getElementById('engineLabel');
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const searchClearBtn = document.getElementById('searchClearBtn');
            const options = document.querySelectorAll('.engine-option');

            // Открытие выпадающего списка + фикс слоев через JS
            currentEngine.addEventListener('click', (e) => {
                e.stopPropagation();
                const isActive = engineSelector.classList.toggle('is-active');
                searchContainer.style.zIndex = isActive ? '50' : '5';
            });

            // Выбор поисковика
            options.forEach(option => {
                option.addEventListener('click', () => {
                    options.forEach(opt => opt.classList.remove('is-selected'));
                    option.classList.add('is-selected');

                    const engineName = option.innerText;
                    const actionUrl = option.getAttribute('data-action');
                    const queryParam = option.getAttribute('data-query');

                    engineLabel.textContent = engineName;
                    searchForm.setAttribute('action', actionUrl);
                    searchInput.setAttribute('name', queryParam);
                    searchInput.placeholder = `Поиск в ${engineName}...`;
                    
                    engineSelector.classList.remove('is-active');
                    searchContainer.style.zIndex = '5';
                    searchInput.focus();
                });
            });

            // Закрытие селектора по клику мимо + сброс слоев
            document.addEventListener('click', () => {
                engineSelector.classList.remove('is-active');
                searchContainer.style.zIndex = '5';
            });

            // Контроль видимости крестика при вводе текста
            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim().length > 0) {
                    searchClearBtn.classList.add('is-visible');
                } else {
                    searchClearBtn.classList.remove('is-visible');
                }
            });

            // Клик по крестику — очистить строку
            searchClearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchClearBtn.classList.remove('is-visible');
                searchInput.focus();
            });

            // Автоочистка после отправки формы
            searchForm.addEventListener('submit', () => {
                setTimeout(() => {
                    searchInput.value = '';
                    searchClearBtn.classList.remove('is-visible');
                }, 100);
            });

            // Модальные окна для папок и секретного блока
            const cards = document.querySelectorAll('.folder-card, #secret-tile');
            const overlay = document.getElementById('folder-overlay');
            const modalBody = document.getElementById('modal-body');
            const closeBtn = document.getElementById('modal-close-btn');

            const closeFolder = () => overlay.classList.remove('is-active');

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const isProtected = card.getAttribute('data-protected') === 'true';
                    const targetId = card.getAttribute('data-target');
                    
                    if (isProtected) {
                        const passwordTemplate = document.getElementById('password-prompt-template');
                        modalBody.innerHTML = '';
                        modalBody.appendChild(passwordTemplate.content.cloneNode(true));
                        overlay.classList.add('is-active');
                        
                        const passwordInput = document.getElementById('folderPasswordInput');
                        passwordInput.focus();

                        const passwordForm = document.getElementById('passwordForm');
                        const passwordError = document.getElementById('passwordError');

                        passwordForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            if (passwordInput.value === '4815162342') {
                                const template = document.getElementById(`${targetId}-template`);
                                if (template) {
                                    modalBody.innerHTML = '';
                                    modalBody.appendChild(template.content.cloneNode(true));
                                }
                            } else {
                                passwordError.style.display = 'block';
                                passwordInput.value = '';
                                passwordInput.focus();
                            }
                        });
                        return;
                    }

                    const template = document.getElementById(`${targetId}-template`);
                    if (template) {
                        modalBody.innerHTML = '';
                        modalBody.appendChild(template.content.cloneNode(true));
                        overlay.classList.add('is-active');
                    }
                });
            });

            closeBtn.addEventListener('click', closeFolder);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeFolder(); });
            document.addEventListener('keydown', (e) => { if (e.key('Escape')) closeFolder(); });
        });
    </script>
